# Dedicated Mula agents profile. Do not reuse a personal Hermes home.
model:
  default: huihui_ai/qwen3-abliterated:latest
  provider: custom
  # Set by MULA_MODEL_BASE_URL (default: local Ollama at http://127.0.0.1:11434/v1).
  # Docker uses http://host.docker.internal:11434/v1; OpenRouter later.
  base_url: ${MULA_MODEL_BASE_URL}
  # Actual Ollama window; the scoped Mula patch allows it while the only tools are Mula's own.
  context_length: 40960

agent:
  max_turns: 8
  mula_compact_operator: true
  # Leave out the runtime's generic coding-agent guidance (tool-use enforcement, execution
  # discipline, task completion, parallel tool calls). It is written for coding agents, more than
  # doubles every prompt, and on the small local model it drowns out Mula's role and the owner's
  # instructions. Mula's own agent prompts say when to use each tool.
  tool_use_enforcement: false
  execution_guidance: false
  task_completion_guidance: false
  parallel_tool_call_guidance: false

# Agents get only the business tools the Mula backend serves at /mcp
# (server/src/features/agents/tools.py). Terminal, file, web, memory and
# delegation tools stay off. The backend checks every call against a per-turn
# ticket and the owner's settings, including approval before asking another agent.
platform_toolsets:
  api_server: [mula]
  cli: [no_mcp]
mcp_servers:
  mula:
    url: http://127.0.0.1:8000/mcp/
    headers:
      Authorization: Bearer ${MULA_TOOLS_KEY}
    trust: full
    timeout: 300
    tools:
      include: [ask_agent, calculate_forecast, latest_forecast, remember]
      resources: false
      prompts: false
# Show these few tools to the model directly. The default search bridge adds a
# discovery step, and its tool names would not qualify for the small-context patch.
tools:
  tool_search:
    enabled: "off"
# The runtime's own memory stays off. Each account has its own memory store in
# Mula (server/src/features/memory), and agents save to it with the `remember` tool.
memory:
  memory_enabled: false
  user_profile_enabled: false
compression:
  enabled: true
  threshold_tokens: 24000
  protect_last_n: 6
display:
  interim_assistant_messages: false
gateway:
  # Serve one profile per account under /p/<profile>/ (see server/hermes/profile.config.yaml).
  # Each profile has its own API key, runtime sessions and secrets.
  multiplex_profiles: true
  api_server:
    host: 127.0.0.1
    port: 8642
    model_name: hermes-agent
