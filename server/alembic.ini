# Alembic configuration for running the command by hand from the server/ folder:
#     MULA_DATABASE_URL=postgresql://... server/.venv/bin/alembic -c server/alembic.ini current
# The backend runs the same migrations itself at startup (src/common/database.py::migrate).
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
